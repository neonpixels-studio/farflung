name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npm run lint:ci
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
      - run: npx nuxt prepare
      - run: npm run test:ci

  changed:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            e2e:
              - 'app/**'
              - 'server/**'
              - 'e2e/**'
              - 'tests/**'
              - 'playwright.config.ts'
              - 'nuxt.config.ts'
              - 'package-lock.json'
              - 'package.json'

  list-specs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      specs: ${{ steps.list.outputs.specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          specs=$(find e2e -maxdepth 1 -name "*.spec.ts" -exec basename {} .spec.ts \; | sort | jq -R . | jq -sc .)
          echo "specs=$specs" >> $GITHUB_OUTPUT

  e2e:
    needs: [ci, changed, list-specs]
    if: |
      always() &&
      needs.ci.result == 'success' &&
      github.event_name == 'pull_request' &&
      needs.changed.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJson(needs.list-specs.outputs.specs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npx playwright install chromium --with-deps
      - name: Load Neon credentials from .env.e2e
        # The Neon project id and API key live encrypted in .env.e2e, so the only
        # repository secret this job needs is DOTENV_PRIVATE_KEY_E2E. Decrypt them
        # into $GITHUB_ENV so the create/delete branch actions below read them via
        # ${{ env.* }}. add-mask keeps the API key out of the logs (dotenvx values
        # are not auto-masked the way secrets.* are).
        #
        # DOTENV_PRIVATE_KEY_E2E must exist in BOTH secret stores: Actions AND
        # Dependabot. Dependabot PRs run against the separate Dependabot secret
        # store, so an Actions-only secret is empty there and dotenvx fails with
        # DECRYPTION_FAILED. Add new encrypted-env keys to both (gh secret set
        # <NAME> --app dependabot).
        run: |
          project_id="$(npx dotenvx get NEON_PROJECT_ID -f .env.e2e)"
          api_key="$(npx dotenvx get NEON_API_KEY -f .env.e2e)"
          echo "::add-mask::$api_key"
          echo "NEON_PROJECT_ID=$project_id" >> "$GITHUB_ENV"
          echo "NEON_API_KEY=$api_key" >> "$GITHUB_ENV"
        env:
          DOTENV_PRIVATE_KEY_E2E: ${{ secrets.DOTENV_PRIVATE_KEY_E2E }}
      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          api_key: ${{ env.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.spec }}
      - name: Run database migrations
        # Migrate over the DIRECT (non-pooler) URL; the app runs over the pooled
        # one below. drizzle-kit is invoked directly (not via `npm run db:migrate`,
        # which wraps dotenvx -f .env): the branch URL is injected below, so no
        # env decryption — and thus no dev private key — is needed here.
        run: npx drizzle-kit migrate
        env:
          E2E_DATABASE_URL: ${{ steps.neon.outputs.db_url }}
      - name: Run E2E tests (${{ matrix.spec }})
        # `npm run e2e` is `dotenvx run -f .env.e2e -- playwright test`; the spec
        # path is appended after `--`. dotenvx decrypts the Clerk keys from
        # .env.e2e, while E2E_DATABASE_URL below (the fresh Neon branch) overrides
        # the file's value — a var already in the environment wins.
        run: npm run e2e -- e2e/${{ matrix.spec }}.spec.ts
        env:
          DOTENV_PRIVATE_KEY_E2E: ${{ secrets.DOTENV_PRIVATE_KEY_E2E }}
          E2E_DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
      - name: Delete Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          api_key: ${{ env.NEON_API_KEY }}
          branch: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.spec }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.spec }}
          path: e2e/report/
          retention-days: 7

  e2e-gate:
    name: E2E Gate
    needs: [e2e]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report status
        run: |
          result="${{ needs.e2e.result }}"
          if [[ "$result" == "success" || "$result" == "skipped" ]]; then
            echo "E2E: $result"
          else
            echo "E2E failed with result: $result"
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        run: bash .github/scripts/gitleaks-scan.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - name: Audit dependencies
        run: bash .github/scripts/audit.sh
